app = "fanfluence-fansuite"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4317
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  FANFLUENCE_MODE = "production"
  FANFLUENCE_HOST = "0.0.0.0"
  FANFLUENCE_PORT = "4317"
  FANFLUENCE_ALLOW_LAN = "true"
  FANFLUENCE_DATA_DIR = "/data"